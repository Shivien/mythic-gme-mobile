
<mat-toolbar class="gap--3" color="primary">
  <h1 class="toolbar__title">Mythic GME Mobile</h1>

  <div class="spacer"></div>

  <button matIconButton aria-label="Basculement du menu" (click)="sidenav.toggle()">
    <mat-icon>menu</mat-icon>
  </button>
</mat-toolbar>

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #sidenav
    [(opened)]="opened"
    fixedInViewport="true"
    fixedTopGap="0"
    fixedBottomGap="0"
    >

    <mat-nav-list>
      <mat-list-item (click)="sidenav.close()">
        <div class="flex cross--center gap--3">
          <mat-icon>arrow_back</mat-icon>
          <span>Fermer</span>
        </div>
      </mat-list-item>
    </mat-nav-list>

    @for (section of sections; track $index)
    {
      <hr />

      @if (section.name !== null) {
        <h2 class="title--2">{{ section.name }}</h2>
      }

      <mat-nav-list>
        @for (link of section.links; track $index)
        {
          <mat-list-item
            class="link"
            [routerLink]="link.route"
            routerLinkActive="mdc-list-item--activated"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="sidenav.close()"
            >
            <div class="flex cross--center gap--3">
              <mat-icon>{{ link.icon }}</mat-icon>
              <span>{{ link.label }}</span>
            </div>
          </mat-list-item>
        }
      </mat-nav-list>
    }

  </mat-sidenav>
</mat-sidenav-container>
